name: CozyCornorBot - Daily AI Post

on:
  schedule:
    # 10 evenly spread cron triggers across daytime hours (UTC)
    - cron: '0 6 * * *'
    - cron: '0 7 * * *'
    - cron: '30 8 * * *'
    - cron: '0 10 * * *'
    - cron: '30 11 * * *'
    - cron: '0 13 * * *'
    - cron: '30 14 * * *'
    - cron: '0 16 * * *'
    - cron: '30 17 * * *'
    - cron: '0 19 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system fonts
        run: sudo apt-get install -y fonts-dejavu-core

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install diffusers transformers torch Pillow playwright accelerate

      - name: Install Playwright Chromium with dependencies
        run: playwright install chromium --with-deps

      - name: Run bot
        env:
          IG_PASSWORD: ${{ secrets.IG_PASSWORD }}
        run: python bot.py

      - name: Upload debug screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: "*.png"
