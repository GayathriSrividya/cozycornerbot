name: Run CozyCorner AI Bot

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'
    - cron: '0 2 * * *'
    - cron: '0 4 * * *'
    - cron: '0 6 * * *'
    - cron: '0 8 * * *'
    - cron: '0 10 * * *'
    - cron: '0 12 * * *'
    - cron: '0 14 * * *'
    - cron: '0 16 * * *'
    - cron: '0 18 * * *'

permissions:
  contents: read

concurrency:
  group: cozycornerbot-run
  cancel-in-progress: true

jobs:
  generate-and-publish-instagram-post:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Pillow playwright diffusers transformers torch

      - name: Install Playwright browser and system dependencies
        run: python -m playwright install --with-deps chromium

      - name: Validate required files
        run: test -f publish_dynamic.py

      - name: Execute AI automation
        env:
          IG_USERNAME: ${{ vars.IG_USERNAME || 'cozycorner4245' }}
          IG_PASSWORD: ${{ secrets.IG_PASSWORD }}
        run: python publish_dynamic.py
